<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>AI與詞義偏誤工作坊</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700;900&display=swap">
<style>
/* Layout: projector deck — sticky section rail on top, one slide at a time (max 1100px), prev/next + teacher notes at bottom. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --surface2:#e8edf1; --fg:#17212b; --muted:#566271; --line:#d0d8e0;
  --accent:#1d5f7a; --accent-fg:#ffffff; --accent-soft:#d9eaf2;
  --mark:#c0392b; --mark-soft:#fbe3df;
  --cwn:#1f7a5c; --cwn-soft:#dcf0e6; --ai:#6b3fb8; --ai-soft:#e9e0f8; --warn:#9a5b00; --warn-soft:#fbefd9;
  --font-body:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --font-display:"Noto Serif TC","Songti TC","PMingLiU",Georgia,serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121820; --surface:#1b222b; --surface2:#252e39; --fg:#e9eef3; --muted:#9ba7b4; --line:#34404c;
  --accent:#6fb6d4; --accent-fg:#0f1a21; --accent-soft:#1d3540;
  --mark:#ff8a75; --mark-soft:#4a2520;
  --cwn:#6fd0a8; --cwn-soft:#1d3a2e; --ai:#c4a7f5; --ai-soft:#332647; --warn:#f0b24a; --warn-soft:#3d2e14; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#121820; --surface:#1b222b; --surface2:#252e39; --fg:#e9eef3; --muted:#9ba7b4; --line:#34404c;
  --accent:#6fb6d4; --accent-fg:#0f1a21; --accent-soft:#1d3540;
  --mark:#ff8a75; --mark-soft:#4a2520;
  --cwn:#6fd0a8; --cwn-soft:#1d3a2e; --ai:#c4a7f5; --ai-soft:#332647; --warn:#f0b24a; --warn-soft:#3d2e14; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:18px;line-height:1.7;margin:0}
.shell{min-height:100%;display:flex;flex-direction:column}
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 16px}
.rail-in{max-width:1100px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
.rail button{flex:0 0 auto;border:0;background:transparent;color:var(--muted);border-radius:999px;padding:6px 12px;font:inherit;font-size:.8rem;font-weight:600;white-space:nowrap;cursor:pointer}
.rail button.on{background:var(--accent);color:var(--accent-fg)}
.rail button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main{flex:1;width:100%;max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:28px 24px}
.slide{display:flex;flex-direction:column;gap:20px}
.kicker{font-size:.8rem;letter-spacing:.1em;color:var(--accent);font-weight:700}
h1,h2,h3{font-family:var(--font-display);line-height:1.3;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:900}
h2{font-size:clamp(1.5rem,3.4vw,2.2rem);font-weight:700}
h3{font-size:1.15rem;font-weight:700}
p{margin:0;max-width:65ch}
a{color:var(--accent)}
.lead{font-size:1.15rem;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.85rem}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.card.cwn{border-top:5px solid var(--cwn)} .card.ai{border-top:5px solid var(--ai)}
.card.soft{background:var(--surface2);border-color:transparent}
ul.clean{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.chip{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.8rem;font-weight:600;background:var(--surface2);color:var(--fg)}
.chip.cwn{background:var(--cwn-soft);color:var(--cwn)} .chip.ai{background:var(--ai-soft);color:var(--ai)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.err{color:var(--mark);font-weight:700;text-decoration:underline wavy var(--mark);text-underline-offset:4px}
.fix{color:var(--cwn);font-weight:700}
.ex{font-family:var(--font-display);font-size:1.3rem}

/* 50-minute timeline */
.tl{display:flex;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.tl>div{padding:10px 8px;font-size:.8rem;line-height:1.35;min-width:0;border-right:1px solid var(--line);background:var(--surface)}
.tl>div:last-child{border-right:0}
.tl b{display:block;font-size:.95rem;font-variant-numeric:tabular-nums}
.tl .disc{background:var(--accent-soft)}
@media (max-width:640px){ .tl{flex-direction:column} .tl>div{flex:auto!important;border-right:0;border-bottom:1px solid var(--line)} }

/* error-type quad */
.quad{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.quad div{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface)}
.quad div.hl{border:2px solid var(--mark);background:var(--mark-soft)}
.quad strong{font-family:var(--font-display);font-size:1.2rem;display:block}

/* CWN structure diagram */
.net{display:grid;grid-template-columns:minmax(120px,180px) 1fr;gap:14px;align-items:stretch}
.net .lemma{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border-radius:12px;background:var(--accent);color:var(--accent-fg);padding:16px}
.net .lemma strong{font-family:var(--font-display);font-size:2.2rem;line-height:1.1}
.senses{display:flex;flex-direction:column;gap:10px;min-width:0}
.sense{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:10px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface)}
.sense .def b{font-size:.75rem;letter-spacing:.06em;color:var(--muted);display:block}
.rels{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
@media (max-width:640px){ .net{grid-template-columns:1fr} .sense{grid-template-columns:1fr} }

/* timeline of CWN */
.hist{display:flex;flex-direction:column;gap:0;border-left:3px solid var(--line);margin-left:6px}
.hist div{position:relative;padding:0 0 14px 20px}
.hist div::before{content:"";position:absolute;left:-9px;top:8px;width:15px;height:15px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.hist b{font-variant-numeric:tabular-nums;font-family:var(--font-display);font-size:1.1rem;margin-right:8px}
.person{display:flex;flex-direction:column;gap:4px}
.person .nm{font-family:var(--font-display);font-size:1.5rem;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stats div{border-radius:10px;background:var(--surface2);padding:12px}
.stats b{display:block;font-family:var(--font-display);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.2}

/* group allocation */
.alloc{display:flex;flex-direction:column;gap:10px}
.alloc .row{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:start;border-bottom:1px solid var(--line);padding-bottom:10px}
.alloc .row:last-child{border-bottom:0}
.alloc .gp{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.alloc .tx{font-family:var(--font-display);font-size:1rem;line-height:1.8;min-width:0}
@media (max-width:640px){ .alloc .row{grid-template-columns:1fr;gap:2px} }
.join{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.qr{background:#ffffff;padding:10px;border-radius:10px;width:180px;height:180px;display:flex;align-items:center;justify-content:center;color:#17212b;font-size:.75rem;text-align:center}
.qr img,.qr canvas{display:block;max-width:100%}
.url{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.85rem;word-break:break-all;background:var(--surface2);border-radius:6px;padding:4px 8px}
@media (max-width:640px){ .join{grid-template-columns:1fr} }

/* stage + timer */
.stagehead{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end}
.timer{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface)}
.timer .t{font-family:var(--font-display);font-size:2.4rem;font-weight:700;font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:right;line-height:1}
.timer.over .t{color:var(--mark)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);border-radius:8px;padding:8px 14px;font:inherit;font-size:.9rem;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.todo{counter-reset:t;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
.todo li{counter-increment:t;display:grid;grid-template-columns:36px 1fr;gap:12px}
.todo li>div{min-width:0}
.todo li::before{content:counter(t);width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:flex;align-items:center;justify-content:center}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.flow>div{flex:1 1 150px;border-radius:10px;padding:10px 12px;background:var(--surface2);font-size:.9rem;min-width:0}
.flow>div b{display:block;font-size:1rem}
.flow .arr{flex:0 0 auto;align-self:center;background:none;padding:0;color:var(--muted);font-size:1.2rem}
.big-q{font-family:var(--font-display);font-size:clamp(1.15rem,2.4vw,1.5rem);line-height:1.6}
.closing{border-radius:14px;background:var(--accent);color:var(--accent-fg);padding:22px}
.closing p{max-width:none}
.closing .big-q{color:var(--accent-fg)}

/* teacher notes + footer */
.notes{border:1px dashed var(--warn);background:var(--warn-soft);border-radius:12px;padding:14px 16px;font-size:.95rem}
.notes h3{color:var(--warn);font-size:1rem;margin-bottom:6px}
.foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.foot-in{max-width:1100px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.foot .pos{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.toggle{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);cursor:pointer}
@media (prefers-reduced-motion:no-preference){ .slide{animation:in .25s ease-out} @keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}} }
</style>

<div class="shell">
  <nav class="rail" aria-label="投影頁"><div class="rail-in" id="rail"></div></nav>
  <main id="main"></main>
  <div class="foot"><div class="foot-in">
    <button class="btn ghost" id="prev">← 上一頁</button>
    <label class="toggle"><input type="checkbox" id="notesToggle"> 教師備註</label>
    <span class="pos" id="pos"></span>
    <button class="btn" id="next">下一頁 →</button>
  </div></div>
</div>

<script src="../content/config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
'use strict';
// ====== 設定：全部來自 content/config.js ======
const C=window.CWN_CONFIG||{};
const STUDENT_URL=C.studentUrl||'';
const CWN_URL=C.cwnUrl||'https://lopentu.github.io/CwnWeb/';
// 「1–3 組」這類標籤由 groups 自動產生
const groupLabel=gs=>{ const a=[...gs].sort((x,y)=>x-y); const consecutive=a.every((g,i)=>i===0||g===a[i-1]+1); return (consecutive&&a.length>1?a[0]+'–'+a[a.length-1]:a.join('、'))+' 組' };
const SENTS=(C.sentences||[]).map(s=>({id:s.id,g:groupLabel(s.groups),t:s.toks.split('|').join(''),ref:String(s.ref||'').replace(/^可留意：/,'').replace(/。$/,'')}));

const SLIDES=[
 {id:'start', nav:'開場', html:()=>`
  <div class="kicker">華語文教學系 · 詞彙AI實作課</div>
  <h1>AI與詞義偏誤</h1>
  <p class="lead">從學習者真實語料出發：用專業工具分析，並請AI 幫忙做教材，專家與AI協作合適的教材。</p>
  <div class="grid g2">
    <div class="card"><div class="kicker">目標一</div><h3>偏誤句分析</h3><p style="margin-top:6px">找出詞彙誤代、解釋錯在哪裡，並從語意關係出發設計教學。</p></div>
    <div class="card"><div class="kicker">目標二</div><h3>用 AI 做互動教材</h3><p style="margin-top:6px">沒有程式背景也能引導 AI 做出教師端＋學生端的練習網頁，並判斷內容合不合適。</p></div>
  </div>
  <div>
    <h3 style="margin-bottom:8px">今天的 50 分鐘</h3>
    <div class="tl">
      <div style="flex:3"><b>3′</b>認識 CWN</div>
      <div style="flex:5"><b>5′</b>1 找出誤代詞</div>
      <div style="flex:12"><b>12′</b>2 分隊分析（人類／AI）</div>
      <div style="flex:15"><b>15′</b>3 比較與討論</div>
      <div style="flex:15" class="disc"><b>15′</b>全班分享討論</div>
    </div>
  </div>`,
  notes:'前 35 分鐘按頁面推進；每個階段頁都有計時器。學生任務單的教師端可同步「通知全班目前階段」。'},

 {id:'error', nav:'什麼是誤代', html:()=>`
  <div class="kicker">先備概念</div>
  <h2>偏誤分析裡的「誤代」</h2>
  <p>常見的偏誤分類有四種。今天的句子全部屬於<strong>誤代</strong>：在這個語境裡，應該用甲詞，學習者卻用了乙詞。</p>
  <div class="quad">
    <div><strong>遺漏</strong><span class="small muted">該有的成分沒有出現</span></div>
    <div><strong>誤加</strong><span class="small muted">多了不該有的成分</span></div>
    <div class="hl"><strong>誤代</strong><span class="small">用錯了詞：該用甲，卻用了乙</span></div>
    <div><strong>錯序</strong><span class="small muted">成分的位置放錯了</span></div>
  </div>
  <div class="card">
    <div class="kicker">舉例</div>
    <p class="ex" style="margin-top:6px">週末我們去<span class="err">參觀</span>了王老師。 → 去<span class="fix">拜訪</span>了王老師。</p>
    <p class="muted" style="margin-top:8px">「參觀」和「拜訪」在學習者的母語裡可能是同一個詞（例如英語都可以說 visit），但中文裡「參觀」的對象是地方、展覽，「拜訪」的對象是人。</p>
  </div>
  <div class="card soft">
    <h3>誤代常發生在哪些詞之間？</h3>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px"><span class="chip acc">意思相近（近義詞）</span><span class="chip acc">母語翻譯相同</span><span class="chip acc">字形相近</span><span class="chip acc">讀音相近</span><span class="chip acc">搭配不同</span></div>
    <p style="margin-top:10px">要說清楚「為什麼不能這樣用」，就需要知道每個詞有哪些<strong>義項</strong>、常跟什麼詞<strong>搭配</strong>、和其他詞有什麼<strong>語意關係</strong>。這正是中文詞彙網路整理的內容。</p>
  </div>`,
  notes:'可以請同學先回想詞彙課、語法課看過的偏誤句，屬於哪一類。'},

 {id:'cwn', nav:'CWN 是什麼', html:()=>`
  <div class="kicker">認識工具</div>
  <h2>中文詞彙網路（Chinese Wordnet, CWN）</h2>
  <p>CWN 以「<strong>義項</strong>（sense）」為單位整理中文詞彙：一個詞拆成一個個義項，各有詞性、釋義與例句；義項之間再用<strong>語意關係</strong>連成網路。</p>
  <div class="net" role="img" aria-label="CWN 的結構：一個詞有多個義項，每個義項連到不同語意關係">
    <div class="lemma"><span class="small">詞條 lemma</span><strong>某詞</strong><span class="small">一個詞形</span></div>
    <div class="senses">
      <div class="sense"><div class="def"><b>義項 1</b>詞性 · 釋義 · 例句</div><div class="rels"><span class="chip cwn">同義詞</span><span class="chip cwn">近義詞</span><span class="chip acc">上位詞</span></div></div>
      <div class="sense"><div class="def"><b>義項 2</b>詞性 · 釋義 · 例句</div><div class="rels"><span class="chip acc">下位詞</span><span class="chip ai">反義詞</span></div></div>
      <div class="sense"><div class="def"><b>義項 3 …</b>同一個詞的其他意思</div><div class="rels"><span class="chip">整體—部分</span><span class="chip">其他關係</span></div></div>
    </div>
  </div>
  <div class="grid g3">
    <div class="card"><h3>義項 sense</h3><p class="small" style="margin-top:4px">同一個詞的不同意思分開列出。學習者常常只學到其中一個義項，就拿去用在別的語境。</p></div>
    <div class="card"><h3>同義詞集 synset</h3><p class="small" style="margin-top:4px">意思相同的義項歸成一組。可以看出哪些詞「真的可以互換」，哪些只是部分重疊。</p></div>
    <div class="card"><h3>語意關係 relations</h3><p class="small" style="margin-top:4px">同義、近義、反義、上位—下位、整體—部分等。是設計「近義詞辨析」教學的切入點。</p></div>
  </div>`,
  notes:'結構圖是示意，不是某個詞的真實資料。可現場在 CWN 查一個詞示範。'},

 {id:'history', nav:'CWN 的建立', html:()=>`

  <div class="grid g3">

// ====== 狀態與導覽 ======
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)) }catch(e){ return null } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)) }catch(e){} }
let idx=0;
const h=(location.hash||'').slice(1);
const hi=SLIDES.findIndex(s=>s.id===h);
if(hi>=0) idx=hi; else { const saved=lsGet('cwnteach:idx'); if(typeof saved==='number'&&saved<SLIDES.length) idx=saved }
let showNotes=!!lsGet('cwnteach:notes');
const timers={}; // id -> {left, running, endAt}
let tick=null;

const rail=document.getElementById('rail'), main=document.getElementById('main');
rail.innerHTML=SLIDES.map((s,i)=>`<button data-i="${i}">${s.nav}</button>`).join('');
rail.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.i)));
document.getElementById('prev').addEventListener('click',()=>go(idx-1));
document.getElementById('next').addEventListener('click',()=>go(idx+1));
const nt=document.getElementById('notesToggle'); nt.checked=showNotes;
nt.addEventListener('change',()=>{ showNotes=nt.checked; lsSet('cwnteach:notes',showNotes); render() });
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if(e.key==='ArrowRight'||e.key==='PageDown') go(idx+1);
  if(e.key==='ArrowLeft'||e.key==='PageUp') go(idx-1);
});

function go(i){ if(i<0||i>=SLIDES.length) return; idx=i; lsSet('cwnteach:idx',idx); try{ history.replaceState(null,'','#'+SLIDES[idx].id) }catch(e){} render(); window.scrollTo({top:0}) }

function timerHTML(){ return `<div class="timer" id="timer"><span class="t" id="tval"></span><button class="btn" id="tgo">開始</button><button class="btn ghost" id="treset">重設</button></div>` }
function tState(s){ if(!timers[s.id]) timers[s.id]={left:s.min*60,running:false,endAt:0}; return timers[s.id] }
function drawTimer(){
  const s=SLIDES[idx]; if(!s.min) return; const st=tState(s);
  const left=st.running?(st.endAt-Date.now())/1000:st.left;
  const el=document.getElementById('tval'); if(!el) return;
  const a=Math.abs(Math.round(left));
  el.textContent=(left<0?'+':'')+Math.floor(a/60)+':'+String(a%60).padStart(2,'0');
  document.getElementById('timer').classList.toggle('over',left<0);
  document.getElementById('tgo').textContent=st.running?'暫停':(st.left<s.min*60?'繼續':'開始');
}
function wireTimer(){
  const s=SLIDES[idx]; if(!s.min) return; const st=tState(s);
  document.getElementById('tgo').addEventListener('click',()=>{
    if(st.running){ st.left=(st.endAt-Date.now())/1000; st.running=false } else { st.endAt=Date.now()+st.left*1000; st.running=true }
    drawTimer();
  });
  document.getElementById('treset').addEventListener('click',()=>{ st.running=false; st.left=s.min*60; drawTimer() });
  drawTimer();
}

function render(){
  const s=SLIDES[idx];
  rail.querySelectorAll('button').forEach((b,i)=>{ b.classList.toggle('on',i===idx); if(i===idx) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current') });
  const on=rail.querySelector('button.on'); if(on&&on.scrollIntoView) on.scrollIntoView({block:'nearest',inline:'center'});
  const notes=typeof s.notes==='function'?s.notes():s.notes;
  main.innerHTML=`<section class="slide">${s.html()}${showNotes&&notes?`<aside class="notes"><h3>教師備註</h3><div>${notes}</div></aside>`:''}</section>`;
  document.getElementById('pos').textContent=(idx+1)+' / '+SLIDES.length;
  document.getElementById('prev').disabled=idx===0;
  document.getElementById('next').disabled=idx===SLIDES.length-1;
  wireTimer();
  if(s.id==='groups') drawQR();
}
function drawQR(){
  const box=document.getElementById('qr'); if(!box) return;
  if(typeof QRCode==='undefined'){ box.textContent='無法產生 QR code，請改用下方連結'; return }
  box.innerHTML=''; try{ new QRCode(box,{text:STUDENT_URL,width:160,height:160,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M}) }catch(e){ box.textContent='無法產生 QR code，請改用下方連結' }
}
setInterval(()=>{ const s=SLIDES[idx]; if(s.min&&timers[s.id]&&timers[s.id].running) drawTimer() },500);
render();
})();
</script>
