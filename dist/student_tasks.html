<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>偏誤句小組任務單</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700;900&display=swap">
<style>
/* Layout: same family as the teaching deck — sticky group bar + page rail on top, one task page at a time (max 860px), prev/next at bottom. Teacher view widens to 1100px. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --surface2:#e8edf1; --fg:#17212b; --muted:#566271; --line:#d0d8e0;
  --accent:#1d5f7a; --accent-fg:#ffffff; --accent-soft:#d9eaf2;
  --mark:#c0392b; --mark-soft:#fbe3df;
  --human:#1f7a5c; --human-soft:#dcf0e6; --ai:#6b3fb8; --ai-soft:#e9e0f8;
  --ok:#2e7d32; --warn:#9a5b00; --warn-soft:#fbefd9;
  --font-body:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --font-display:"Noto Serif TC","Songti TC","PMingLiU",Georgia,serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121820; --surface:#1b222b; --surface2:#252e39; --fg:#e9eef3; --muted:#9ba7b4; --line:#34404c;
  --accent:#6fb6d4; --accent-fg:#0f1a21; --accent-soft:#1d3540;
  --mark:#ff8a75; --mark-soft:#4a2520;
  --human:#6fd0a8; --human-soft:#1d3a2e; --ai:#c4a7f5; --ai-soft:#332647;
  --ok:#7ad48a; --warn:#f0b24a; --warn-soft:#3d2e14; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#121820; --surface:#1b222b; --surface2:#252e39; --fg:#e9eef3; --muted:#9ba7b4; --line:#34404c;
  --accent:#6fb6d4; --accent-fg:#0f1a21; --accent-soft:#1d3540;
  --mark:#ff8a75; --mark-soft:#4a2520;
  --human:#6fd0a8; --human-soft:#1d3a2e; --ai:#c4a7f5; --ai-soft:#332647;
  --ok:#7ad48a; --warn:#f0b24a; --warn-soft:#3d2e14; color-scheme:dark }

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:17px;line-height:1.7;margin:0}
h1,h2,h3{font-family:var(--font-display);line-height:1.3;text-wrap:balance;margin:0}
h1{font-size:clamp(1.8rem,5vw,2.6rem);font-weight:900}
h2{font-size:clamp(1.4rem,3.6vw,2rem);font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0;max-width:65ch}
a{color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:.85rem}
.kicker{font-size:.8rem;letter-spacing:.1em;color:var(--accent);font-weight:700}
.kicker.human{color:var(--human)} .kicker.ai{color:var(--ai)}
.lead{font-size:1.08rem;color:var(--muted)}
.wrap{width:100%;max-width:860px;margin:0 auto;padding-inline:16px;padding-block:24px 32px}
.wrap.wide{max-width:1100px}
.page{display:flex;flex-direction:column;gap:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.grid>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.card.soft{background:var(--surface2);border-color:transparent}
.card.human{border-top:5px solid var(--human)} .card.ai{border-top:5px solid var(--ai)}
.chip{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.8rem;font-weight:600;background:var(--surface2);color:var(--fg)}
.chip.human{background:var(--human-soft);color:var(--human)} .chip.ai{background:var(--ai-soft);color:var(--ai)} .chip.acc{background:var(--accent-soft);color:var(--accent)}

/* top bars */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;padding:8px 16px;display:flex;flex-direction:column;gap:6px}
.top .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.top .gname{font-family:var(--font-display);font-weight:700;font-size:1.1rem}
.rail{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
.rail button{flex:0 0 auto;border:0;background:transparent;color:var(--muted);border-radius:999px;padding:6px 12px;font:inherit;font-size:.82rem;font-weight:600;white-space:nowrap;cursor:pointer}
.rail button.on{background:var(--accent);color:var(--accent-fg)}
.rail button.human.on{background:var(--human);color:var(--bg)}
.rail button.ai.on{background:var(--ai);color:var(--bg)}
.rail button.done::after{content:" ✓"}
.rail button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.foot-in{max-width:860px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between}
.foot .pos{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* controls */
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);border-radius:8px;padding:9px 16px;font-weight:600;font-size:.95rem}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:5px 11px;font-size:.82rem}
.btn.human{background:var(--human);border-color:var(--human);color:var(--bg)}
.btn.ai{background:var(--ai);border-color:var(--ai);color:var(--bg)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600;border:1px solid var(--line);background:var(--surface2)}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600}
label.f .hint{font-weight:400;color:var(--muted);font-size:.85rem}
input[type=text],input[type=password],select,textarea{font:inherit;font-weight:400;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.6}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.dirty{border-color:var(--warn)!important}
::placeholder{color:var(--muted);opacity:.75}
.status{font-size:.8rem;color:var(--muted)}
.status.ok{color:var(--ok)} .status.warn{color:var(--warn)}
.savebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px}

/* steps */
.todo{counter-reset:t;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
.todo li{counter-increment:t;display:grid;grid-template-columns:34px 1fr;gap:12px}
.todo li>div{min-width:0}
.todo li::before{content:counter(t);width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:flex;align-items:center;justify-content:center}
.todo.human li::before{background:var(--human-soft);color:var(--human)}
.todo.ai li::before{background:var(--ai-soft);color:var(--ai)}

/* sentence */
.sent{font-family:var(--font-display);font-size:1.12rem;line-height:2}
.tok{display:inline-block;padding:0 2px;border-radius:4px;border:1px solid transparent;cursor:pointer;background:none;font:inherit;color:inherit;line-height:1.6;margin:2px 0}
.tok.punct{cursor:default;padding:0}
.tok:not(.punct):not(.heat){border-bottom:1px dashed var(--line)}
.tok:not(.punct):not(.heat):hover{border-color:var(--accent)}
.tok.marked{background:var(--mark-soft);color:var(--mark);border-color:var(--mark)!important;font-weight:700}
.tok:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tok.heat{cursor:default}

/* flow + team picker */
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.flow>div{border-radius:10px;padding:12px;background:var(--surface);border:1px solid var(--line)}
.flow b{display:block;font-family:var(--font-display);font-size:1.05rem}
.flow .t{font-variant-numeric:tabular-nums;font-size:.8rem;color:var(--muted)}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.team{border-radius:12px;padding:18px;border:2px solid var(--line);background:var(--surface);text-align:left;color:var(--fg);display:flex;flex-direction:column;gap:6px}
.team.human{border-color:var(--human)} .team.ai{border-color:var(--ai)}
.team strong{font-family:var(--font-display);font-size:1.3rem}
.team.human strong{color:var(--human)} .team.ai strong{color:var(--ai)}
.team:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmp>div{min-width:0;display:flex;flex-direction:column;gap:8px;border-radius:10px;padding:12px}
.cmp .wrong{background:var(--mark-soft)} .cmp .right{background:var(--human-soft)}
.cmp .lbl{font-size:.8rem;font-weight:700}
.cmp .wrong .lbl{color:var(--mark)} .cmp .right .lbl{color:var(--human)}
@media (max-width:560px){ .cmp{grid-template-columns:1fr} }
.tpl{position:relative;background:var(--surface2);border-radius:8px;padding:44px 12px 12px;font-size:.88rem;white-space:pre-wrap;word-break:break-word;line-height:1.6;border:1px dashed var(--line);margin-top:8px;max-height:240px;overflow:auto}
.tpl .copy{position:absolute;top:8px;right:8px}
.tpl .tname{position:absolute;top:12px;left:12px;font-size:.78rem;font-weight:700;color:var(--ai)}
details.help summary{cursor:pointer;font-weight:600;color:var(--accent)}
.banner{border-left:4px solid var(--accent);background:var(--accent-soft);padding:8px 14px;border-radius:8px;font-size:.92rem;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.score{display:flex;gap:8px;flex-wrap:wrap}
.score label{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;font-family:var(--font-display);font-size:1.2rem}
.score input{position:absolute;opacity:0;pointer-events:none}
.score input:checked+span{color:var(--accent-fg)}
.score label:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.score label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}

/* login */
.gpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.gpick button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:12px 8px;text-align:center}
.gpick button strong{display:block;font-family:var(--font-display);font-size:1.4rem}
.gpick button span{font-size:.75rem;color:var(--muted)}
.gpick button:hover{border-color:var(--accent)}
.gpick button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* teacher */
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.tbl th{font-weight:600;color:var(--muted);font-size:.8rem}
.scroll{overflow-x:auto}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.gcell{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);text-align:left;color:var(--fg)}
.gcell .n{font-family:var(--font-display);font-size:1.2rem;font-weight:700}
.dots{display:flex;gap:4px;margin-top:6px}
.dots span{width:22px;height:6px;border-radius:3px;background:var(--line)}
.dots span.on{background:var(--ok)}
.ans{background:var(--surface2);border-radius:8px;padding:10px 12px;white-space:pre-wrap;word-break:break-word;font-size:.95rem}
.ans.empty{color:var(--muted);font-style:italic}
.proj .sent{font-size:1.5rem} .proj .ans{font-size:1.1rem}
.refbox{border:1px dashed var(--warn);background:var(--warn-soft);border-radius:10px;padding:10px 14px;font-size:.9rem}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
@media (prefers-reduced-motion:no-preference){ .page{animation:in .22s ease-out} @keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}} }
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }
</style>

<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
// =====================================================================
//  詞網與AI偏誤工作坊 · 課堂設定檔
//  這是唯一需要編輯的檔案。改完後執行 `python3 build.py`，
//  dist/ 與 artifact_source/ 裡的網頁會自動更新。
//  （直接用瀏覽器開 src/ 裡的網頁，也會即時讀到這裡的設定。）
// =====================================================================
window.CWN_CONFIG = {

  // ---- 基本 ----
  teacherCode: 'cwn2026',          // 教師端通關碼
  totalGroups: 14,                 // 全班組數
  cwnUrl: 'https://lopentu.github.io/CwnWeb/',
  // 教學頁 QR code 連到的學生任務單網址
  studentUrl: 'https://claude.ai/artifact/4AxQFegPfkYEBcoSPt6tcr',

  // ---- 學生答案要存到哪裡 ----
  // 1. 在 claude.ai 上以 Artifact 開啟時：自動用 Artifact 的共用資料庫（即時同步）。
  // 2. 其他情況（本機檔案、GitHub Pages）：若下面填了 Google Apps Script 網址，
  //    就存到你的 Google 試算表（設定步驟見 backend/README.md）。
  // 3. 兩者都沒有：只存在學生自己的裝置，最後用「複製本組答案」交卷。
  sheetEndpoint: 'https://script.google.com/macros/s/AKfycbys9unrQsi1idR6RbV3p8njNnBWcm5hzp3svMfb6C9XbG2d2ogjMENAGycyvoR7bJHt/exec',               // 例：'https://script.google.com/macros/s/XXXX/exec'
  sheetPollSeconds: 8,             // 試算表模式下，多久向試算表拿一次最新答案

  // ---- 階段（教師端「通知全班目前階段」與學生端橫幅）----
  stages: [
    { n: 1, title: '找出誤代詞', min: 5 },
    { n: 2, title: '分隊分析',   min: 12 },
    { n: 3, title: '比較與結論', min: 15 },
  ],

  // ---- 偏誤句 ----
  // 語料：國家教育研究院華語中介語語料庫（2019），偏誤類型皆為詞彙誤代。
  //   id     ：句子編號（教學頁、任務單、匯出檔都用這個編號）
  //   groups ：拿到這一句的組別
  //   toks   ：句子本文，用「|」斷詞，只是為了讓學生可以逐詞點選
  //   ref    ：教師參考（只在教師端顯示；草稿，非標準答案）
  sentences: [
    { id: 1, groups: [1, 2, 3],
      toks: '原因|在於|我|個人|生活|。|如果|發生|災禍|，|我|有|家人|和|朋友|可以|安慰|我|，|可以|緩和|我|的|痛苦|。|我|不|認識|的|一|位|神秘|的|上帝|無助於|減少|痛苦|。|而且|在|美國|一般|來說|，|信仰|宗教|的|人|比較|保守|，|所以|我|對於|他們|敬而遠之|。',
      ref: '可留意：緩和／減輕（痛苦）、減少／減輕、災禍／不幸、對於／對。' },
    { id: 2, groups: [4, 5, 6],
      toks: '臺灣|超|多|夜市|，|很|多|小菜|，|食物|我|從來|都|沒有|看|過|，|又|好看|又|好吃|！|夜市|最|代表|好像|是|牛排|跟|臭豆腐|因為|我|去|過|好幾|個|夜市|都|問到|那|個|味道|。|我|覺得|臭豆腐|是|一|種|很|特別|的|食物|因為|它|有|辣味|，|甜味|，|鹹味|，|而|有|臭味|。',
      ref: '可留意：小菜／小吃、問到／聞到、最代表／最有代表性、而有／還有。' },
    { id: 3, groups: [7, 8, 9],
      toks: '我|傷心|或|壓力|的|時候|吸菸|使|我|的|心情|好|。|在|我|的|國家|沒有|很|多|人|抽煙|，|我|覺得|是|因為|很|多|人|都|知道|吸煙|壞|他們|的|身體|所以|他們|很|恐怕|。',
      ref: '可留意：恐怕／害怕（副詞 vs. 動詞）、壞／傷害（對…有害）、壓力／有壓力。' },
    { id: 4, groups: [10, 11, 12],
      toks: '我|抱|著|咸恩|的|心情|，|因為|我|認為|很|多|人|即使|想要|也|沒有|辨法|像|我|有|這樣|的|機會|，|可以|到|台灣|來|念|大學|，|所以|我|是|個|很|幸運|的|人|，|我|想|人生|只|有|一|次|，|所以|我|要|做|我|想|做|的|事情|。',
      ref: '可留意：咸恩、辨法屬錯字，可先區分「錯字」與「誤代」；心情／心（抱著感恩的心）、想要／想。' },
    { id: 5, groups: [13, 14],
      toks: '總而言之|，|台灣|也|已|成為|全球|生育率|最|低|的|國家|之一|，|越來越|多|的|人|不|結婚|，|他們|覺得|寧缺勿濫|，|只要|合不來|就|分手|。|解決|這|個|問題|的|一|種|方法|不|只是|給|錢|，|因為|除非|政府|能|針對|整體|環境|來|改善|，|否則|婦女|還是|不|會|有|生育|的|意願|，|所|政府|有|很|沉重|的|責任|。',
      ref: '可留意：沉重／重大（責任）、方法／辦法、不只是／不能只是、給錢／發放補助。' },
  ],

  // ---- AI 分析小隊的兩個模板 ----
  // 模板 1 裡的 {{sentence}} 會自動換成該組的偏誤句。
  templates: {
    gemini: `你是一位資深華語教師，也是詞彙語意學家。我要做一個給「華語教師」和「華語學習者」用的互動網頁。

【偏誤句】（國教院華語中介語語料庫，偏誤類型：詞彙誤代）
「{{sentence}}」

請依序完成三件事：
1. 找出句子裡用錯的詞，說明應該改成什麼詞。請從詞義、搭配、語意關係（近義／上下位／反義）說明為什麼錯，以及學習者為什麼會搞混。
2. 幫我寫一段完整的 prompt，讓我交給另一個 AI（Claude 或 ChatGPT）做成「單一 HTML 檔」的互動網頁。網頁需求：
   - 教師端：顯示偏誤點、學生可能搞混的原因、教學時要強調的重點
   - 學生端：用學習者看得懂的話說明錯在哪裡；3 題類似情境的練習題；2 題近義詞比較練習；答完馬上顯示對錯和解釋
   - 全部繁體中文、手機可以用、不用安裝任何東西
3. 給我這個網頁的初步 HTML 程式碼（可以先不完整）。`,

    builder: `請把下面的需求做成「一個單一 HTML 檔」的互動網頁（CSS 和 JavaScript 都寫在同一個檔案裡），做好後讓我可以直接預覽。

【需求與初步程式碼】
（把 Gemini 給你的 prompt 和程式碼貼在這裡）

補充要求：
- 全部使用繁體中文
- 教師端和學生端用兩個分頁切換
- 練習題可以點選作答，並馬上顯示對錯和解釋
- 清楚標出偏誤句原文、用錯的詞和正確的詞`,
  },
};

<script>
(function(){
'use strict';
// ====== 設定：全部來自 content/config.js ======
const C=window.CWN_CONFIG||{};
const TEACHER_CODE=C.teacherCode||'cwn2026';
const CWN_URL=C.cwnUrl||'https://lopentu.github.io/CwnWeb/';
const TOTAL_GROUPS=C.totalGroups||14;
const LS={ group:'cwntask:group', data:'cwntask:g', teacher:'cwntask:teacher', page:'cwntask:page' };

// 偏誤句：toks 以「|」斷詞，只是為了方便點選
const SENTENCES=(C.sentences||[]).map(s=>{ const tokens=s.toks.split('|'); return Object.assign({},s,{tokens,text:tokens.join('')}) });
const PUNCT=/^[，。！？、；：「」（）]$/;
const sentenceForGroup=g=>SENTENCES.find(s=>s.groups.includes(g))||SENTENCES[0];

// 老師廣播用的階段
const STAGES=C.stages||[ {n:1,title:'找出誤代詞',min:5}, {n:2,title:'分隊分析',min:12}, {n:3,title:'比較與結論',min:15} ];
// 學生端頁面
const PAGES=[
 {id:'start', nav:'開始'},
 {id:'s1',    nav:'1 找誤代詞', sec:'s1'},
 {id:'human', nav:'2 人類分析小隊', sec:'human', cls:'human'},
 {id:'ai',    nav:'2 AI 分析小隊', sec:'ai', cls:'ai'},
 {id:'s3',    nav:'3 比較與結論', sec:'s3'},
];
// AI 分析小隊的模板
const tplGemini=sent=>String((C.templates&&C.templates.gemini)||'').split('{{sentence}}').join(sent);
const TPL_BUILDER=String((C.templates&&C.templates.builder)||'');

// 匯出用的欄位（教師端 CSV；tools/export.py 也用同一組欄位）
const EXPORT_COLUMNS=[['組'],['偏誤句'],['1點選','s1.markedWords'],['1改成','s1.fix'],['1為什麼','s1.why'],['人類_用錯的詞','human.wrongWord'],['人類_用錯詞義項','human.wrongSense'],['人類_正確的詞','human.rightWord'],['人類_正確詞義項','human.rightSense'],['人類_差別','human.diff'],['人類_解釋','human.explain'],['人類_教學計畫','human.plan'],['AI_改法','ai.aiFix'],['AI_理由','ai.aiExplain'],['AI_網頁','ai.result'],['AI_過程','ai.notes'],['AI_prompt','ai.prompt'],['3比一比','s3.compare'],['3AI分數','s3.score'],['3最終答案','s3.final'],['3一句話','s3.share'],['更新時間','updatedAt']];

// ====== 小工具 ======
const $=(s,el)=>(el||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function lsGet(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null }catch(e){ return null } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)) }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k) }catch(e){} }
const now=()=>new Date().toISOString();
const fmtTime=iso=>iso?new Date(iso).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}):'';
const mmss=sec=>{ sec=Math.max(0,Math.round(sec)); return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0') };
let toastT; function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800) }
function copyText(text){
  const fallback=()=>{ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('已複製') }catch(e){ toast('請手動選取複製') } ta.remove(); };
  if(!navigator.clipboard||!navigator.clipboard.writeText){ fallback(); return Promise.resolve() }
  return navigator.clipboard.writeText(text).then(()=>toast('已複製'),fallback);
}
const getPath=(o,p)=>p.split('.').reduce((a,k)=>a&&a[k],o);
const clone=o=>JSON.parse(JSON.stringify(o));

// ====== 儲存後端 ======
// 三種後端共用同一組介面，其他程式只透過 S.store 存取：
//   mode                      'db' | 'sheet' | 'local'
//   saveGroup(id, data)       儲存一組的答案（id 形如 'g3'）
//   saveSettings(data)        儲存教師廣播（目前階段）
//   watchGroup(id, cb)        某一組的答案有更新時呼叫 cb(data)；回傳取消函式
//   watchGroups(cb)           全班答案有更新時呼叫 cb({g1:{...},...})
//   watchSettings(cb)         教師廣播有更新時呼叫 cb(settings)
const noop=()=>{};
function makeLocalStore(){
  return { mode:'local',
    async saveGroup(id,data){ lsSet(LS.data+id.slice(1),data) },
    async saveSettings(){ throw new Error('local') },
    watchGroup(){ return noop }, watchGroups(){ return noop }, watchSettings(){ return noop },
  };
}
function makeDbStore(db){
  return { mode:'db',
    saveGroup:(id,data)=>db.doc('groups/'+id).set(data),
    saveSettings:data=>db.doc('settings/class').set(data),
    watchGroup:(id,cb)=>db.doc('groups/'+id).onSnapshot(snap=>{ if(!snap.exists||snap.metadata.hasPendingWrites) return; cb(clone(snap.data())) },noop),
    watchGroups:cb=>db.collection('groups').onSnapshot(snap=>{ const o={}; snap.docs.forEach(d=>o[d.id]=d.data()); cb(o) },noop),
    watchSettings:cb=>db.doc('settings/class').onSnapshot(snap=>cb(snap.exists?snap.data():{}),noop),
  };
}
// Google 試算表（Apps Script 網頁應用程式；程式碼在 backend/google_sheets.gs）。
// 儲存＝POST JSON；更新＝定時 GET 全部資料。POST 用 text/plain 可避開 CORS 預檢。
function makeSheetStore(url){
  const POLL=Math.max(3,+C.sheetPollSeconds||8)*1000;
  let cache={groups:{},settings:{}}, timer=null, pulling=false;
  const L={group:new Map(),groups:new Set(),settings:new Set()};
  const withQ=q=>url+(url.includes('?')?'&':'?')+q;
  async function post(body){
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json(); if(!j.ok) throw new Error(j.error||'save failed'); return j;
  }
  async function pull(){
    if(pulling) return; pulling=true;
    try{ const r=await fetch(withQ('action=all&_='+Date.now()),{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status);
      const j=await r.json(); if(!j.ok) throw new Error(j.error||'load failed');
      cache={groups:j.groups||{},settings:j.settings||{}}; notify(); }
    finally{ pulling=false }
  }
  function notify(){
    L.groups.forEach(cb=>cb(cache.groups));
    L.settings.forEach(cb=>cb(cache.settings.class||{}));
    L.group.forEach((set,id)=>{ if(cache.groups[id]) set.forEach(cb=>cb(clone(cache.groups[id]))) });
  }
  function ensurePolling(){ if(timer) return; pull().catch(noop); timer=setInterval(()=>{ if(document.visibilityState==='visible') pull().catch(noop) },POLL) }
  // 訂閱時先給目前快取的內容，並立刻重新抓一次，之後靠定時輪詢
  const sub=(set,cb,initial)=>{ set.add(cb); if(initial!==undefined) cb(initial); ensurePolling(); pull().catch(noop); return ()=>set.delete(cb) };
  return { mode:'sheet',
    async saveGroup(id,data){ await post({type:'group',id,data}); cache.groups[id]=clone(data); notify() },
    async saveSettings(data){ await post({type:'settings',id:'class',data}); cache.settings.class=clone(data); notify() },
    watchGroup(id,cb){ if(!L.group.has(id)) L.group.set(id,new Set()); return sub(L.group.get(id),cb,cache.groups[id]&&clone(cache.groups[id])) },
    watchGroups:cb=>sub(L.groups,cb,cache.groups),
    watchSettings:cb=>sub(L.settings,cb,cache.settings.class||{}),
    ping:()=>pull(),
  };
}

// ====== 狀態 ======
const S={
  view:'login', group:lsGet(LS.group), page:0,
  store:null, user:null, mode:'pending', data:{}, cls:{}, dirty:new Set(), groupUnsub:null,
  t:{ unlocked:!!lsGet(LS.teacher), tab:'overview', sel:1, projSent:1, groups:{}, unsub:null },
};
{ const p=lsGet(LS.page); if(typeof p==='number'&&p<PAGES.length) S.page=p }
const remote=()=>S.mode==='db'||S.mode==='sheet';

// ====== 儲存 ======
function loadLocal(){ S.data=S.group?(lsGet(LS.data+S.group)||{}):{} }
async function saveSection(sec,val){
  if(!S.group) return;
  val.at=now();
  S.data=Object.assign({},S.data,{[sec]:val,group:S.group,sentence:sentenceForGroup(S.group).id,updatedAt:now()});
  lsSet(LS.data+S.group,S.data);
  [...S.dirty].filter(k=>k.startsWith(sec+'.')).forEach(k=>S.dirty.delete(k));
  document.querySelectorAll('[data-k^="'+sec+'."]').forEach(el=>el.classList.remove('dirty'));
  showSaved(sec,remote()?false:undefined);
  if(remote()&&S.store){
    try{ await S.store.saveGroup('g'+S.group,S.data); showSaved(sec,true); toast('已儲存') }
    catch(e){
      if(e&&e.code==='invalid_argument'){ S.mode='local'; renderModePill() }
      showSaved(sec); toast('沒有存到老師那裡，先存在這台裝置');
    }
  } else toast('已存在這台裝置');
  renderRail();
}
function showSaved(sec,server){
  const el=document.querySelector('[data-status="'+sec+'"]'); if(!el) return;
  const at=S.data[sec]&&S.data[sec].at;
  if(!at){ el.textContent='還沒儲存'; el.className='status'; return }
  if(remote()&&server!==undefined){ el.textContent=server===false?'儲存中…':'已儲存 · '+fmtTime(at); el.className='status ok' }
  else if(remote()){ el.textContent='已儲存 · '+fmtTime(at); el.className='status ok' }
  else { el.textContent='已存在這台裝置 · '+fmtTime(at); el.className='status warn' }
}

// ====== 連線：決定用哪個後端 ======
async function initStore(){
  let store=null;
  try{
    const [db,user]=await Promise.all([window.claude?.use?.('db'),window.claude?.use?.('user')]);
    if(db){
      let w=null; try{ w=await user?.can('data.write') }catch(e){}
      if(w!==false){ store=makeDbStore(db); S.user=user||null }
      try{ if(await user?.isOwner()){ S.t.unlocked=true; lsSet(LS.teacher,true) } }catch(e){}
    }
  }catch(e){}
  if(!store&&C.sheetEndpoint){
    const sheet=makeSheetStore(C.sheetEndpoint);
    try{ await sheet.ping(); store=sheet }catch(e){ console.warn('Google 試算表連不上，改存本機：',e) }
  }
  if(!store) store=makeLocalStore();
  S.store=store; S.mode=store.mode; renderModePill();
  if(remote()){
    store.watchSettings(cls=>{ S.cls=cls||{}; renderBanner(); renderTeacherStageBar() });
    if(S.group) subscribeGroup();
    if(S.view==='teacher') subscribeTeacher();
  }
  if(S.t.unlocked&&S.view==='login') render();
}
function subscribeGroup(){
  if(!S.store||!remote()||!S.group) return;
  if(S.groupUnsub) S.groupUnsub();
  S.groupUnsub=S.store.watchGroup('g'+S.group,data=>{
    // 只接受比手上更新的資料，避免輪詢時把剛存的答案蓋掉
    if(S.data.updatedAt&&data.updatedAt&&data.updatedAt<S.data.updatedAt) return;
    S.data=data; lsSet(LS.data+S.group,S.data);
    syncFields(); renderRail();
  });
}
function subscribeTeacher(){
  if(!S.store||!remote()||S.t.unsub) return;
  S.t.unsub=S.store.watchGroups(groups=>{ S.t.groups=groups||{}; if(S.view==='teacher') renderTeacherBody() });
}
// 組員儲存後，把自己沒在改的欄位換成最新內容
function syncFields(){
  document.querySelectorAll('[data-k]').forEach(el=>{
    const k=el.dataset.k; if(S.dirty.has(k)||el===document.activeElement) return;
    const v=getPath(S.data,k);
    if(el.type==='radio') el.checked=String(v)===el.value; else el.value=v==null?'':v;
  });
  const line=$('#tokLine');
  if(line&&!S.dirty.has('s1.marked')){ const mk=new Set(getPath(S.data,'s1.marked')||[]); line.querySelectorAll('.tok[data-i]').forEach(b=>b.classList.toggle('marked',mk.has(+b.dataset.i))) }
  ['s1','human','ai','s3'].forEach(k=>showSaved(k));
}

// ====== 畫面骨架 ======
const app=$('#app');
function render(){
  if(S.view==='teacher'&&S.t.unlocked){ renderTeacher(); return }
  if(!S.group){ S.view='login'; renderLogin(); return }
  S.view='student'; renderStudent();
}
function renderLogin(){
  app.innerHTML=`<main class="wrap"><div class="page">
    <div><div class="kicker">華語文教學 · 詞彙誤代偏誤分析</div><h1 style="margin-top:6px">偏誤句小組任務單</h1>
      <p class="lead" style="margin-top:8px">點你們的組別就可以開始。全組共用一份答案，任何人按「儲存」，組員的畫面都會一起更新。</p></div>
    <div class="card stack">
      <h2>你是第幾組？</h2>
      <div class="gpick">${Array.from({length:TOTAL_GROUPS},(_,i)=>i+1).map(g=>`<button type="button" data-g="${g}"><strong>${g}</strong><span>偏誤句 ${sentenceForGroup(g).id}</span></button>`).join('')}</div>
      <p class="status" id="modePill"></p>
    </div>
    <details class="card soft help">
      <summary>教師入口</summary>
      <form class="row" id="teacherForm" style="margin-top:10px">
        <input type="password" id="inCode" placeholder="通關碼" style="flex:1;min-width:140px" autocomplete="off">
        <button class="btn ghost" type="submit">進入教師端</button>
      </form>
      <p class="status" id="codeMsg"></p>
      ${S.t.unlocked?'<p class="small" style="margin-top:6px"><a href="#" id="goTeacher">已解鎖教師端，直接進入 →</a></p>':''}
    </details>
  </div></main>`;
  app.querySelectorAll('[data-g]').forEach(b=>b.addEventListener('click',()=>{ S.group=+b.dataset.g; lsSet(LS.group,S.group); loadLocal(); S.page=0; lsSet(LS.page,0); subscribeGroup(); render() }));
  $('#teacherForm').addEventListener('submit',e=>{ e.preventDefault();
    if($('#inCode').value===TEACHER_CODE){ S.t.unlocked=true; lsSet(LS.teacher,true); S.view='teacher'; subscribeTeacher(); render() }
    else { $('#codeMsg').textContent='通關碼不對，再試一次。'; $('#codeMsg').className='status warn' }
  });
  const gt=$('#goTeacher'); if(gt) gt.addEventListener('click',e=>{ e.preventDefault(); S.view='teacher'; subscribeTeacher(); render() });
  renderModePill();
}
const MODE_TEXT={
  pending:['正在連線…','… 連線中',''],
  db:['已連線：答案會直接存給老師。','● 即時儲存','ok'],
  sheet:['已連線 Google 試算表：答案會直接存給老師。','● 存到試算表','ok'],
  local:['沒有連到老師的資料庫：答案會先存在這台裝置，最後按「複製本組答案」交給老師。','○ 存在本機','warn'],
};
function renderModePill(){
  const m=MODE_TEXT[S.mode]||MODE_TEXT.pending;
  const el=$('#modePill'); if(el){ el.textContent=m[0]; el.className='status '+m[2] }
  const p=$('#modeMini'); if(p){ p.textContent=m[1]; p.className='pill '+m[2] }
}

function renderStudent(){
  app.innerHTML=`
  <div class="top"><div class="top-in">
    <div class="bar">
      <span class="gname">第 ${S.group} 組 · 偏誤句 ${sentenceForGroup(S.group).id}</span>
      <div class="row" style="gap:6px"><span class="pill" id="modeMini"></span><button class="btn ghost sm" id="btnCopyAll">複製本組答案</button><button class="btn ghost sm" id="btnLeave">換組</button></div>
    </div>
    <nav class="rail" id="rail" aria-label="任務頁"></nav>
  </div></div>
  <main class="wrap"><div id="banner"></div><div id="pageBody"></div></main>
  <div class="foot"><div class="foot-in"><button class="btn ghost" id="prev">← 上一頁</button><span class="pos" id="pos"></span><button class="btn" id="next">下一頁 →</button></div></div>`;
  $('#btnLeave').addEventListener('click',()=>{ lsDel(LS.group); S.group=null; if(S.groupUnsub){S.groupUnsub();S.groupUnsub=null} S.dirty.clear(); render() });
  $('#btnCopyAll').addEventListener('click',()=>copyText(summaryText()));
  $('#prev').addEventListener('click',()=>go(S.page-1));
  $('#next').addEventListener('click',()=>go(S.page+1));
  renderModePill(); renderRail(); renderBanner(); renderPage();
}
function go(i){ if(i<0||i>=PAGES.length) return; S.page=i; lsSet(LS.page,i); renderRail(); renderPage(); window.scrollTo({top:0}) }
function secDone(sec){
  const d=S.data;
  return sec==='s1'?!!(d.s1&&d.s1.fix) : sec==='human'?!!(d.human&&d.human.explain) : sec==='ai'?!!(d.ai&&d.ai.aiExplain) : sec==='s3'?!!(d.s3&&d.s3.final) : false;
}
function renderRail(){
  const r=$('#rail'); if(!r) return;
  r.innerHTML=PAGES.map((p,i)=>`<button data-i="${i}" class="${i===S.page?'on':''} ${p.cls||''} ${p.sec&&secDone(p.sec)?'done':''}">${p.nav}</button>`).join('');
  r.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.i)));
  const on=r.querySelector('.on'); if(on&&on.scrollIntoView) on.scrollIntoView({block:'nearest',inline:'center'});
  const pos=$('#pos'); if(pos) pos.textContent=(S.page+1)+' / '+PAGES.length;
  const pv=$('#prev'), nx=$('#next'); if(pv) pv.disabled=S.page===0; if(nx) nx.disabled=S.page===PAGES.length-1;
}
function renderBanner(){
  const el=$('#banner'); if(!el) return;
  const c=S.cls, st=c&&STAGES.find(s=>s.n===c.stage);
  if(!st){ el.innerHTML=''; return }
  el.innerHTML=`<div class="banner" style="margin-bottom:16px"><span>老師現在進行：<strong>階段 ${st.n} ${st.title}</strong></span><span class="timer" id="clsTimer"></span></div>`;
  tickClass(c.stageStartedAt?new Date(c.stageStartedAt).getTime():null,st.min);
}
let clsTick; function tickClass(started,min){ clearInterval(clsTick); if(!started) return; const f=()=>{ const el=$('#clsTimer'); if(!el){clearInterval(clsTick);return} const left=min*60-(Date.now()-started)/1000; el.textContent=(left>=0?'還剩 ':'超時 ')+mmss(Math.abs(left)); el.style.color=left<0?'var(--mark)':'' }; f(); clsTick=setInterval(f,1000) }

// ====== 欄位 ======
function ta(k,label,hint,ph,rows){ const v=getPath(S.data,k); return `<label class="f">${label}${hint?`<span class="hint">${hint}</span>`:''}<textarea data-k="${k}" rows="${rows||3}" placeholder="${esc(ph||'')}">${esc(v||'')}</textarea></label>` }
function inp(k,label,ph){ const v=getPath(S.data,k); return `<label class="f">${label}<input type="text" data-k="${k}" placeholder="${esc(ph||'')}" value="${esc(v||'')}"></label>` }
function saveBar(sec,text,cls){ return `<div class="savebar"><span class="status" data-status="${sec}"></span><button class="btn ${cls||''}" data-save="${sec}">${text||'儲存'}</button></div>` }
function collect(sec){ const o={}; document.querySelectorAll('[data-k^="'+sec+'."]').forEach(el=>{ const f=el.dataset.k.split('.')[1]; if(el.type==='radio'){ if(el.checked) o[f]=el.value } else o[f]=el.value.trim() }); return o }
function sentCard(){ const s=sentenceForGroup(S.group); return `<div class="card soft"><div class="kicker">我們的句子 · 偏誤句 ${s.id}</div><p class="sent" style="margin-top:4px">${esc(s.text)}</p></div>` }
function head(kicker,title,min,cls){ return `<div class="row" style="justify-content:space-between;align-items:flex-end"><div><div class="kicker ${cls||''}">${kicker}</div><h2 style="margin-top:4px">${title}</h2></div>${min?`<span class="chip acc">約 ${min} 分鐘</span>`:''}</div>` }

function renderPage(){
  const el=$('#pageBody'); if(!el) return;
  const p=PAGES[S.page], sent=sentenceForGroup(S.group);
  const stageMin=n=>(STAGES.find(s=>s.n===n)||{}).min||'';
  let h='';
  if(p.id==='start'){
    h=`<div class="page">
      ${head('第 '+S.group+' 組','今天要做什麼？')}
      ${sentCard()}
      <p>這是一位華語學習者寫的句子，裡面有<strong>用錯的詞</strong>（誤代：該用甲詞，卻用了乙詞）。今天全組要一起找出錯誤、說明原因，也看看 AI 說得對不對。</p>
      <div class="flow">
        <div><span class="t">${stageMin(1)} 分鐘 · 全組</span><b>1 找誤代詞</b>憑語感找出用錯的詞</div>
        <div><span class="t">${stageMin(2)} 分鐘 · 分兩隊</span><b>2 分隊分析</b>人類分析小隊查 CWN；AI 分析小隊問 AI</div>
        <div><span class="t">${stageMin(3)} 分鐘 · 全組</span><b>3 比較與結論</b>比一比誰說得對，寫下結論</div>
      </div>
      <div class="card stack">
        <h3>階段 2 要分成兩隊（每隊約 3 人）</h3>

  else if(p.id==='ai'){

        ${ta('s3.share','③ 一句話分享：要讓 AI 幫上忙，我們自己需要懂什麼？','老師會把這句話投影出來。','',2)}
        ${saveBar('s3')}
      </div>
      <div class="card soft"><strong>交作業</strong><p class="small" style="margin-top:4px">如果畫面上方顯示「存在本機」，請按「複製本組答案」，貼到老師指定的地方。</p></div>
    </div>`;
  }

  });
  el.querySelectorAll('[data-save]').forEach(b=>b.addEventListener('click',()=>{
    const sec=b.dataset.save, v=collect(sec);
    if(sec==='s1'){ v.marked=[...el.querySelectorAll('.tok.marked')].map(x=>+x.dataset.i); v.markedWords=v.marked.map(i=>sent.tokens[i]).join('、'); S.dirty.delete('s1.marked') }
    saveSection(sec,v);
  }));
  ['s1','human','ai','s3'].forEach(k=>showSaved(k));
}
function summaryText(){
  const d=S.data, sent=sentenceForGroup(S.group), g=k=>getPath(d,k)||'';
  const mk=(getPath(d,'s1.marked')||[]).map(i=>sent.tokens[i]).join('、');
  return [`【偏誤句小組任務單】第 ${S.group} 組`,`偏誤句 ${sent.id}：${sent.text}`,'',
    '■ 1 找誤代詞',`點選：${mk}`,`改成：${g('s1.fix')}`,`為什麼：${g('s1.why')}`,'',
    '■ 2 人類分析小隊',`用錯的詞：${g('human.wrongWord')}｜${g('human.wrongSense')}`,`正確的詞：${g('human.rightWord')}｜${g('human.rightSense')}`,`差在哪裡：${g('human.diff')}`,`怎麼跟學習者說：${g('human.explain')}`,`教學計畫：${g('human.plan')}`,'',
    '■ 2 AI 分析小隊',`AI 的改法：${g('ai.aiFix')}`,`AI 的理由：${g('ai.aiExplain')}`,`網頁：${g('ai.result')}`,`過程：${g('ai.notes')}`,`prompt：${g('ai.prompt')}`,'',
    '■ 3 比較與結論',`比一比：${g('s3.compare')}`,`AI 分數：${g('s3.score')}`,`最終答案：${g('s3.final')}`,`一句話：${g('s3.share')}`].join('\n');
}

    <nav class="rail" id="tRail"><button data-tab="overview">進度總覽</button><button data-tab="group">各組答案</button><button data-tab="proj">投影討論</button></nav>

function renderTeacherStageBar(){
  const el=$('#tStageBar'); if(!el) return;
  const cur=S.cls&&S.cls.stage;
  el.innerHTML=`<div class="row" style="gap:6px"><span class="small muted">通知全班目前階段：</span>${STAGES.map(s=>`<button class="btn sm ${cur===s.n?'':'ghost'}" data-st="${s.n}">${s.n} ${s.title}</button>`).join('')}<button class="btn sm ghost" data-st="0">清除</button><span class="timer" id="clsTimer"></span></div>`;
  el.querySelectorAll('[data-st]').forEach(b=>b.addEventListener('click',async()=>{ if(!remote()){ toast('沒有連到資料庫'); return } try{ await S.store.saveSettings({stage:+b.dataset.st,stageStartedAt:now()}); toast(+b.dataset.st?'已通知階段 '+b.dataset.st:'已清除') }catch(e){ toast('沒有成功，請再試一次') } }));
  const st=STAGES.find(s=>s.n===cur); if(st) tickClass(S.cls.stageStartedAt?new Date(S.cls.stageStartedAt).getTime():null,st.min);
}
const gdoc=g=>S.t.groups['g'+g]||{};
function heatFor(groups,sent){
  const cnt=new Array(sent.tokens.length).fill(0); let n=0;
  groups.forEach(g=>{ const mk=getPath(gdoc(g),'s1.marked'); if(mk&&mk.length){ n++; mk.forEach(i=>{ if(cnt[i]!=null) cnt[i]++ }) } });
  return {n,html:sent.tokens.map((t,i)=>{ if(PUNCT.test(t)) return `<span class="tok punct">${esc(t)}</span>`; const r=n?cnt[i]/n:0; const st=r?`background:color-mix(in srgb, var(--mark) ${Math.round(20+r*60)}%, var(--surface));${r>0.5?'color:var(--accent-fg);font-weight:700':''}`:''; return `<span class="tok heat" style="${st}" title="${cnt[i]} 組">${esc(t)}${cnt[i]?`<sup style="font-size:.6em">${cnt[i]}</sup>`:''}</span>` }).join('')};
}

        <div class="grid g2"><div><span class="small muted">改成</span>${ans(G('s1.fix'))}</div><div><span class="small muted">為什麼</span>${ans(G('s1.why'))}</div></div></div>
      <div class="grid g2">

  else if(t.tab==='proj'){
    const sent=SENTENCES.find(s=>s.id===t.projSent)||SENTENCES[0], gs=sent.groups, h=heatFor(gs,sent);
    el.innerHTML=`<div class="page proj">
      <div class="row">${SENTENCES.map(s=>`<button class="btn sm ${s.id===sent.id?'':'ghost'}" data-ps="${s.id}">句 ${s.id}（第 ${s.groups.join('、')} 組）</button>`).join('')}</div>
      <div class="card stack"><div class="kicker">各組標記 · ${h.n} 組已標記</div><p class="sent">${h.html}</p><p class="small muted">顏色越深＝越多組覺得這個詞用錯了。</p></div>
      <div class="card stack"><h2>各組的答案</h2><div class="scroll"><table class="tbl" style="font-size:1rem"><tr><th>組</th><th>直覺改法</th><th>人類分析小隊</th><th>AI 的改法</th><th>AI 分數</th></tr>${gs.map(g=>{ const d=gdoc(g), G=k=>esc(getPath(d,k)); return `<tr><td><strong>${g}</strong></td><td>${G('s1.fix')||'—'}</td><td>${G('human.wrongWord')&&G('human.rightWord')?G('human.wrongWord')+' → '+G('human.rightWord'):'—'}</td><td>${G('ai.aiFix')||'—'}</td><td>${G('s3.score')||'—'}</td></tr>` }).join('')}</table></div></div>
      <div class="card stack"><h2>一句話分享</h2>${gs.map(g=>{ const v=getPath(gdoc(g),'s3.share'); return `<div class="ans ${v?'':'empty'}"><strong>第 ${g} 組</strong>　${esc(v)||'（尚未填寫）'}</div>` }).join('')}</div>
    </div>`;
    el.querySelectorAll('[data-ps]').forEach(b=>b.addEventListener('click',()=>{ t.projSent=+b.dataset.ps; renderTeacherBody() }));
  }
}

// ====== 匯出 ======
function exportRows(){
  const rows=[EXPORT_COLUMNS.map(c=>c[0])];
  for(let g=1;g<=TOTAL_GROUPS;g++){ const d=gdoc(g); if(!d.updatedAt) continue; const s=sentenceForGroup(g);
    rows.push(EXPORT_COLUMNS.map(([n,k])=>n==='組'?g:n==='偏誤句'?s.id:n==='1點選'?(getPath(d,'s1.markedWords')||(getPath(d,'s1.marked')||[]).map(i=>s.tokens[i]).join('、')):getPath(d,k))) }
  return rows;
}
async function download(filename,data,type){
  try{ const dl=await window.claude?.use?.('downloads'); if(dl){ await dl.save({filename,data}); return true } }catch(e){}
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:type||'text/plain;charset=utf-8'})); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove() },500); return true }catch(e){ return false }
}
const stamp=()=>new Date().toISOString().slice(0,10);
async function exportCSV(){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const csv='﻿'+exportRows().map(r=>r.map(q).join(',')).join('\n');
  if(!(await download('偏誤句小組任務-'+stamp()+'.csv',csv,'text/csv;charset=utf-8'))) copyText(csv).then(()=>toast('已複製 CSV，可貼到試算表'));
}
async function exportJSON(){
  const json=JSON.stringify({exportedAt:now(),mode:S.mode,groups:S.t.groups},null,2);
  if(!(await download('偏誤句小組任務-'+stamp()+'.json',json,'application/json'))) copyText(json).then(()=>toast('已複製 JSON'));
}

// ====== 啟動 ======
if(S.group) loadLocal();
render();
initStore();
})();
</script>
